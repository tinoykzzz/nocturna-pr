<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | NOCTURNA PR</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    .admin-wrap { min-height: 100vh; background: #0a0a0a; color: #fff; font-family: 'Space Grotesk', sans-serif; }
    .admin-login { max-width: 400px; margin: 0 auto; padding: 4rem 2rem; }
    .admin-login h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin-bottom: 2rem; color: #ff003c; }
    .admin-form .form-group { margin-bottom: 1rem; }
    .admin-form label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; opacity: 0.8; }
    .admin-form input { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; font-size: 1rem; }
    .admin-form input:focus { outline: none; border-color: #ff003c; }
    .admin-form button { width: 100%; padding: 1rem; background: #ff003c; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 0.5rem; }
    .admin-form button:hover { background: #e60036; }
    .admin-form .error { color: #ff4444; font-size: 0.85rem; margin-top: 0.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .admin-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
    .admin-header .logout { padding: 0.5rem 1rem; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .admin-header .logout:hover { border-color: #ff003c; color: #ff003c; }
    .admin-nav { display: flex; gap: 1rem; padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .admin-nav button { padding: 0.5rem 1rem; background: transparent; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 0.9rem; }
    .admin-nav button.active { color: #ff003c; font-weight: 600; }
    .admin-content { padding: 2rem; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .admin-table th { font-size: 0.75rem; letter-spacing: 1px; opacity: 0.7; }
    .admin-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .admin-table .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; background: rgba(255,255,255,0.1); border: none; border-radius: 4px; color: #fff; cursor: pointer; margin-right: 0.5rem; }
    .admin-table .btn-sm:hover { background: #ff003c; }
    .admin-table .btn-danger:hover { background: #cc0000; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .add-product-form { max-width: 500px; margin-bottom: 2rem; }
    .add-product-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .orders-list .order-card { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.1); }
    .orders-list .order-card h4 { font-size: 0.9rem; margin-bottom: 0.5rem; }
    .orders-list .order-card .order-meta { font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.5rem; }
    .orders-list .order-card select { padding: 0.35rem 0.5rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; font-size: 0.85rem; }
    .stock-input { width: 70px; padding: 0.35rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; text-align: center; }
  </style>
</head>
<body class="admin-wrap">
  <div id="adminLogin" class="admin-login">
    <h1>NOCTURNA PR — Admin</h1>
    <form class="admin-form" id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="admin@nocturnapr.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <div id="loginError" class="error"></div>
      <button type="submit">INICIAR SESIÓN</button>
    </form>
    <p style="margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.6;">¿Primera vez? Crea tu cuenta en Supabase Dashboard → Authentication → Users → Add user. Luego añade tu email en la tabla admin_emails.</p>
  </div>

  <div id="adminDashboard" style="display: none;">
    <header class="admin-header">
      <h1>NOCTURNA PR — Panel de empleados</h1>
      <button class="logout" id="logoutBtn">CERRAR SESIÓN</button>
    </header>
    <nav class="admin-nav">
      <button class="active" data-section="products">Productos</button>
      <button data-section="orders">Pedidos</button>
    </nav>
    <div class="admin-content">
      <section id="section-products" class="admin-section active">
        <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">Inventario</h2>
        <div class="add-product-form" id="addProductForm">
          <h3 style="margin-bottom: 1rem; font-size: 0.95rem;">Agregar producto</h3>
          <form id="productForm">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" name="name" required placeholder="Ej: POLO SUPRA BEIGE">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Precio ($)</label>
                <input type="number" name="price" step="0.01" required placeholder="45">
              </div>
              <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock" min="0" required placeholder="10">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Categoría</label>
                <select name="category">
                  <option value="polo">Polo</option>
                  <option value="bividi">Bividi</option>
                  <option value="short">Bermudas</option>
                  <option value="perfume">Perfume</option>
                  <option value="polera">Polera</option>
                </select>
              </div>
              <div class="form-group">
                <label>Drop</label>
                <input type="text" name="drop_name" placeholder="segundo, tercer, cuarto...">
              </div>
            </div>
            <div class="form-group">
              <label>Imagen principal (ruta)</label>
              <input type="text" name="image" required placeholder="/segundo-drop/producto.jpeg">
            </div>
            <div class="form-group">
              <label>Imágenes adicionales (separadas por coma)</label>
              <input type="text" name="images" placeholder="/img1.jpeg, /img2.jpeg">
            </div>
            <div class="form-group">
              <label><input type="checkbox" name="new_item"> Producto nuevo</label>
            </div>
            <button type="submit" class="btn-primary">AGREGAR PRODUCTO</button>
          </form>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table" id="productsTable">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </section>
      <section id="section-orders" class="admin-section">
        <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">Pedidos recientes</h2>
        <div class="orders-list" id="ordersList"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
